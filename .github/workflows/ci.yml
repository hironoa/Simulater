name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: ビルド（本物のバックエンド）
        run: ./build.sh
      - name: テスト（モックと本物のバックエンド）
        run: tests/run_tests.sh

  windows:
    runs-on: windows-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64 gcc と clang の確認
        shell: cmd
        run: |
          where clang || set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          gcc --version
          clang --version
      - name: ビルド（本物のバックエンド）
        shell: cmd
        run: |
          call build.bat
      - name: テスト（モックと本物のバックエンド）
        shell: cmd
        run: |
          set PERF_MIN=100
          call tests\run_tests.bat
      - name: コア単体のテストとベンチマーク
        shell: cmd
        run: |
          set BENCH_MIN=100
          call rl78\tests\run_tests.bat
      - name: clang でのビルド互換性
        shell: cmd
        run: |
          where clang >nul 2>nul || set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          set "CC=clang"
          call build.bat build\sim-clang
      - name: 配布物をまとめる
        shell: cmd
        run: |
          mkdir dist
          copy build\sim\sim.exe dist\
          xcopy /e /i /y build\sim\xlate dist\xlate
          xcopy /e /i /y build\sim\native dist\native
          if exist build\sim\sim_gui.html copy build\sim\sim_gui.html dist\
          copy example\sim.cfg dist\sim.cfg.example
          copy README.md dist\
      - uses: actions/upload-artifact@v4
        with:
          name: sim-windows-x64
          path: dist/
