# 試験用: PC 用 DLL の方式（exec = native）
exec = native
# 製品のプロジェクト（入れ替えて使う）
mtpj = ../product/proj/native_test.mtpj
# 製品とは別に管理するソース（ドライバ、スタブ）。このフォルダの .c
native_src = .
# 呼ぶ関数（段階 1 では型をここに書く）
native_func = s16 calc_add(s16 a, s16 b)
native_func = u16 calc_size_of_int(void)
native_func = u16 calc_count(void)
native_func = u16 calc_gain(u16 x)
native_func = u8 calc_bool(u8 on)
native_func = u16 calc_blk(u16 v)
native_func = void io_write_port(u8 v)
native_func = u16 io_read_adc(void)
native_func = u8 io_read_low(void)
native_func = s16 DRV_add3(s16 a, s16 b, s16 c)
