# 試験用: マイコンの番地の範囲にある変数のクリア（exec = native、native_layout）
# 製品は CA78K0R でビルドした probe（tests/ca78k0r_probe。中のファイルは変えない）
exec = native
mtpj = ../../ca78k0r_probe/ca78k0r_probe.mtpj
# 変数のマイコンでの番地と大きさを読むロードモジュール（probe.c と同じビルドのもの）
native_layout = ../../ca78k0r_probe/DefaultBuild/ca78k0r_probe.lmf
# 「RAM の範囲をクリアする」関数の代わりと、試験用の関数（このフォルダの .c）
native_src = .
